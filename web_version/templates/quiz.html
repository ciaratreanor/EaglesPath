{% extends "base.html" %}
{% block title %}Q{{ q_index + 1 }} — Eagle's Path{% endblock %}
{% block content %}

<div class="quiz-page">

  <!-- Background image area with question prompt -->
  <div class="quiz-bg">

    <!-- Full-bleed question image -->
    <img
      src="{{ url_for('static', filename='images/' + question.filename | replace('data/', '')) }}"
      alt="Question {{ q_index + 1 }}"
      class="quiz-bg-img"
    >

    <!-- Progress bar -->
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width: {{ ((q_index) / 5 * 100) | int }}%"></div>
    </div>

    <!-- Prompt overlay box -->
    <div class="prompt-box">
      <div class="prompt-label">QUESTION {{ q_index + 1 }} / 5</div>
      <p class="prompt-text">{{ question.prompt | replace('Q' ~ (q_index+1) ~ ': ', '') }}</p>
    </div>

  </div>

  <!-- Answer buttons panel -->
  <div class="quiz-buttons-panel">
    <form method="POST" action="/quiz/{{ q_index }}">
      <div class="btn-grid">
        {% for option in question.options %}
          <button type="submit" name="choice" value="{{ loop.index0 }}" class="quiz-btn">
            {{ option }}
          </button>
        {% endfor %}
      </div>
    </form>
  </div>

</div>

{% endblock %}
